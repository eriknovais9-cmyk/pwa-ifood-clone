<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery PWA Teste</title>
<link rel="manifest" href="manifest.json">
<style>
body { font-family: Arial; margin:0; padding:20px; background:#f8f8f8; }
h1 { text-align:center; color:#ff4500; }
.produtos { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-top:20px; }
.card { background:white; border-radius:8px; width:200px; padding:15px; box-shadow:0 2px 8px rgba(0,0,0,0.1); text-align:center; }
.card img { width:100%; border-radius:8px; }
.card button { margin-top:10px; padding:8px 12px; border:none; background:#ff4500; color:white; border-radius:5px; cursor:pointer; }
.card button:hover { background:#e03e00; }
#carrinho { position:fixed; bottom:20px; right:20px; background:#ff4500; color:white; border:none; padding:10px 15px; border-radius:50px; cursor:pointer; }
#carrinho span { font-weight:bold; }
</style>
</head>
<body>

<h1>Delivery PWA Teste</h1>

<div class="produtos">
  <div class="card">
    <img src="https://via.placeholder.com/200x150" alt="Hambúrguer">
    <h3>Hambúrguer</h3>
    <p>R$ 15,00</p>
    <button onclick="adicionarCarrinho('Hambúrguer', 15)">Adicionar ao carrinho</button>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/200x150" alt="Pizza">
    <h3>Pizza</h3>
    <p>R$ 25,00</p>
    <button onclick="adicionarCarrinho('Pizza', 25)">Adicionar ao carrinho</button>
  </div>
</div>

<button id="carrinho" onclick="verCarrinho()">Carrinho (<span id="total">0</span>)</button>

<script>
let totalCarrinho = 0;
function adicionarCarrinho(produto, preco) {
  totalCarrinho += preco;
  document.getElementById('total').innerText = totalCarrinho.toFixed(2);
  alert(produto + ' adicionado!');
}
function verCarrinho() {
  alert('Total do carrinho: R$ ' + totalCarrinho.toFixed(2));
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('SW registrado'))
    .catch(err => console.log('Erro SW:', err));
}
</script>

</body>
</html>
